name: Release

# Three ways in, one build.
#
# A TAG PUSHED BY A PERSON starts this directly, which is how v0.1.0 to v0.4.0
# were built.
#
# A TAG CREATED BY release-please DOES NOT. GitHub does not start a workflow
# from an event made with the repository's own GITHUB_TOKEN, which is the token
# release-please runs with -- so merging the v0.5.0 proposal created the tag
# and the release page and this workflow never ran. The page went out with no
# assets at all, where v0.4.0 has six. release-please.yml therefore calls this
# as a reusable workflow once it has cut a release, inside its own run, where
# the token rule does not apply.
#
# BY HAND, for a tag that already exists: the way to put binaries on a release
# that shipped without them. Nothing about the build depends on how it was
# started; `inputs.tag` is empty only for the pushed tag, and every reference to
# the tag below reads `inputs.tag || github.ref_name` for that reason.
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: The tag to build and publish, e.g. v0.6.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and publish, e.g. v0.5.0
        required: true
        type: string

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # LITE — UI + sidecar/model; needs system Python
          - name: macOS lite (universal)
            os: macos-latest
            platform: darwin/universal
            flavor: lite
            artifact: TERRA-macOS-universal-lite.zip
            package_os: darwin
          - name: Windows lite (amd64)
            os: windows-latest
            platform: windows/amd64
            flavor: lite
            artifact: TERRA-Windows-amd64-lite.zip
            package_os: windows
          - name: Linux lite (amd64)
            os: ubuntu-latest
            platform: linux/amd64
            flavor: lite
            artifact: TERRA-Linux-amd64-lite.zip
            package_os: linux

          # FULL — embeds python-build-standalone + requirements.txt (spectral RF)
          - name: macOS full (arm64)
            os: macos-latest
            platform: darwin/arm64
            flavor: full
            artifact: TERRA-macOS-arm64-full.zip
            package_os: darwin
            arch: aarch64
          - name: Windows full (amd64)
            os: windows-latest
            platform: windows/amd64
            flavor: full
            artifact: TERRA-Windows-amd64-full.zip
            package_os: windows
            arch: x86_64
          - name: Linux full (amd64)
            os: ubuntu-latest
            platform: linux/amd64
            flavor: full
            artifact: TERRA-Linux-amd64-full.zip
            package_os: linux
            arch: x86_64

    steps:
      # The tag, not whatever the run was started from. Called from
      # release-please the run belongs to main and a bare checkout would build
      # main's tip -- the same commit today, but not a thing to rely on; started
      # by hand it would build main for an older tag, which is the wrong binary
      # under the right name.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux WebKit/GTK deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev zip

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Cache python-build-standalone
        if: matrix.flavor == 'full'
        uses: actions/cache@v4
        with:
          path: build/cache
          key: pbs-20260728-3.12.13-${{ matrix.package_os }}-${{ matrix.arch }}

      # Ubuntu 24.04 ships webkit2gtk 4.1 only; tell Wails to target it.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails build -platform ${{ matrix.platform }} -clean -tags webkit2_41

      - name: Build (macOS / Windows)
        if: runner.os != 'Linux'
        run: wails build -platform ${{ matrix.platform }} -clean

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/package_release.sh
          args=(--flavor "${{ matrix.flavor }}" --os "${{ matrix.package_os }}" --artifact "${{ matrix.artifact }}")
          if [ -n "${{ matrix.arch }}" ]; then
            args+=(--arch "${{ matrix.arch }}")
          fi
          scripts/package_release.sh "${args[@]}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          if ($arch -eq "") { $arch = "x86_64" }
          ./scripts/package_release.ps1 -Flavor ${{ matrix.flavor }} -Artifact ${{ matrix.artifact }} -Arch $arch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # BEFORE the artifacts are downloaded, not after: actions/checkout runs
      # `git clean -ffdx` unless told otherwise, and dist/ is untracked, so a
      # checkout placed after the download would delete every binary this job
      # exists to publish.
      #
      # The code name, so the release carries it. It was decided in brand.ts and
      # reached exactly two surfaces, both inside the running binary: the splash
      # and the What's New entry. The releases page -- the one place a person
      # goes to refer to a release afterwards, which is what the name is FOR --
      # showed only the tag, so v0.3.0 being Ember had to be recovered from the
      # history of brand.ts.
      #
      # Hard failure is deliberate. check-version.ts guards RELEASE_NAME on every
      # pull request, so a tag cannot be reached without it; if it is missing
      # here, the assumption this reads under is already wrong and a release
      # titled with a silently empty name is worse than one that stops.
      - name: Checkout for the code name
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          sparse-checkout: frontend/src/lib/brand.ts
          sparse-checkout-cone-mode: false

      - name: Read the code name
        id: codename
        run: |
          name=$(sed -nE 's/^export const RELEASE_NAME = "([^"]+)"$/\1/p' \
            frontend/src/lib/brand.ts)
          if [ -z "$name" ]; then
            echo "RELEASE_NAME not found in frontend/src/lib/brand.ts" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # APPENDED, NOT WRITTEN. When release-please cuts the release the page
      # already carries its changelog -- the notes are taken from the proposal's
      # body -- and this action's default is to replace a page's body with its
      # own. Run after release-please, it would have swapped the changelog for
      # an install table. So the table goes underneath, and GitHub's generated
      # list is asked for only when nothing else wrote the page: a tag pushed by
      # hand, where `inputs.tag` is empty.
      #
      # `make_latest: legacy` because this can now run for an older tag. Left
      # to the API default, putting binaries on v0.5.0 after v0.6.0 is out
      # would move "Latest" back to v0.5.0; legacy decides it by date and
      # version, which is the question being asked.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: TERRA ${{ inputs.tag || github.ref_name }} — ${{ steps.codename.outputs.name }}
          append_body: true
          generate_release_notes: ${{ inputs.tag == '' }}
          make_latest: legacy
          draft: false
          prerelease: false
          body: |
            ## Installing

            Two install flavors per platform:

            | Flavor | Assets | What you need |
            |--------|--------|----------------|
            | **FULL** | `*-full.zip` | Unzip and run — embeds Python 3.12 + spectral RF deps |
            | **LITE** | `*-lite.zip` | Smaller; install Python 3.12 + `requirements.txt` yourself |

            **FULL** supports spectral Random Forest (and LULC / phenology) out of the box.
            Temporal Transformer and Prithvi still need torch (`requirements-prithvi.txt`)
            via a system/venv install (`TERRA_PYTHON`).

            macOS FULL is **arm64** (Apple Silicon). LITE macOS remains **universal**.

            Sentinel-2 imagery is read on demand from the Microsoft Planetary
            Computer STAC catalog; no full product download is required.

            See [docs/INSTALL.md](https://github.com/rexionmars/TERRA/blob/main/docs/INSTALL.md).
