name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. The filter here was
  # `branches: [main]`, which selects on the BASE branch, so a pull request
  # opened against another branch ran nothing at all and reported "no checks"
  # -- which reads on the page as a clean result rather than as an absent one.
  # Work stacked in a series, each branch based on the one below it, was
  # therefore unchecked everywhere except at the bottom of the stack.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read from go.mod rather than restated here. Pinned to "1.23" this
          # step silently downloaded the toolchain go.mod actually asks for on
          # every run, so the version named in CI was never the version tested.
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux WebKit/GTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # The three checks below run before the build because each finishes in
      # under a second while the build takes several, and because a drifted
      # contract should be reported by name rather than as a bundling failure.
      - name: Frontend tests
        working-directory: frontend
        run: npm test

      # Compares the JSON field names in internal/analysis/types*.go against the
      # interfaces src/lib/types.ts mirrors by hand. Nothing compared them
      # before, so a field renamed in Go type-checked clean on this side.
      - name: Check the Go/TypeScript type contract
        working-directory: frontend
        run: npm run check:types

      # Existed in package.json but was never run here, which is how a
      # hand-copied palette drifted on every stop while nothing failed.
      - name: Check the palette against index.css
        working-directory: frontend
        run: npm run check:contrast

      # version.go against wails.json, CITATION.cff and the newest What's New
      # entry. wails.json carried no info block at all, so every packaged
      # bundle reported CFBundleShortVersionString 1.0.0 on a v0.4.0 release --
      # to the Finder, the About panel and any crash report -- and nothing
      # failed, because nothing looked.
      - name: Check the version is the same everywhere
        working-directory: frontend
        run: npm run check:version

      # Every Go step below this line needs the frontend built first: main.go
      # carries //go:embed all:frontend/dist, and dist/ is generated, not
      # committed. On a clean checkout each of them fails with "pattern
      # all:frontend/dist: no matching files found", which names the embed and
      # not the missing step.
      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build

      - name: Go vet
        run: go vet ./...

      # The check set is chosen in .golangci.yml, where each entry names the
      # defect it stops from coming back rather than being enabled because it
      # exists. The linter type-checks the Wails bindings, so it needs the GTK
      # headers installed above as well as the frontend built.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

      # ./... and not a subdirectory pattern. This step ran ./backend/... for a
      # long time, which never matched package main, so the tests in
      # app_run_roundtrip_test.go, environment_api_test.go and
      # meshhandler_test.go were written, passed locally, and gated nothing.
      #
      # Under -race because the value of the detector is bounded by what a test
      # actually runs concurrently, and the concurrency tests that make it
      # worth anything were added with this step.
      - name: Go test
        run: go test -race ./...

      # Ubuntu 24.04 ships webkit2gtk 4.1 only; target it via the build tag.
      - name: Go build
        run: go build -tags webkit2_41 ./...

  sidecar:
    name: Sidecar tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Keyed on the lock, not on requirements-dev.txt. The floors in that
          # file do not move when the resolution does, so a cache keyed on it
          # would restore stale wheels after every re-lock.
          cache-dependency-path: requirements-dev.lock.txt

      - name: Install GDAL system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python test deps
        # From the lock rather than the floors, so two runs install the same
        # set. --require-hashes is redundant while every entry carries hashes;
        # it is passed so that a future hashless regeneration fails loudly
        # instead of quietly installing unverified artifacts.
        run: pip install --require-hashes -r requirements-dev.lock.txt

      - name: Byte-compile sidecar
        # Recursive, so the terra package is covered and not only the modules
        # still sitting beside it. A glob of sidecar/*.py silently compiles
        # nothing inside a directory added later.
        run: python -m compileall -q sidecar

      - name: Ruff
        # The rule set is chosen per defect in sidecar/pyproject.toml, as the
        # Go check set is in .golangci.yml. Formatting is not checked: the
        # formatter would rewrite 57 files, which is a decision of its own.
        working-directory: sidecar
        run: ruff check .

      - name: Mypy
        # Strict by module, and the list only grows. Checking the whole package
        # would report 25 errors in code nobody has annotated yet, which is how
        # a type check becomes a step people learn to ignore.
        working-directory: sidecar
        run: mypy terra/protocol.py terra/registry.py terra/cli.py terra/stac.py

      - name: Import contracts
        # The layers the migration was carried out to make true. Run from the
        # sidecar directory because terra is importable from there and nowhere
        # else.
        working-directory: sidecar
        run: lint-imports --config pyproject.toml

      - name: Pytest
        run: pytest sidecar/tests -q
