<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>TERRA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Must run before Leaflet loads: PointerEvent exists in WKWebView/desktop
         and would otherwise set L.Browser.touch=true, closing polygons at 3 pts. -->
    <script>window.L_NO_TOUCH = true</script>
    <script>
      // Rotates the splash still per launch. The list is substituted at build
      // time from src/lib/splashBackground.ts, which owns it -- this used to be
      // a second hard-coded copy that nothing kept in step.
      (function () {
        var images = __SPLASH_IMAGES__;
        var nextKey = "terra.splash.next";
        var currentKey = "terra.splash.current";
        var index = 0;
        try {
          var raw = localStorage.getItem(nextKey);
          var parsed = parseInt(raw || "0", 10);
          if (isFinite(parsed)) index = ((parsed % images.length) + images.length) % images.length;
          localStorage.setItem(nextKey, String((index + 1) % images.length));
          sessionStorage.setItem(currentKey, String(index));
        } catch (e) {}
        var css =
          "linear-gradient(to bottom, rgba(23,23,23,0.22) 0%, rgba(23,23,23,0.28) 40%, rgba(23,23,23,0.55) 100%)," +
          'url("' + images[index] + '") center / cover no-repeat';
        document.documentElement.style.setProperty("--splash-html-bg", css);

        // Only this launch's still is fetched. The React splash used to render
        // all three as background layers, so the browser pulled every one --
        // two of three downloads wasted on a window that shows one, competing
        // with the bundle for the boot it is meant to cover.
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.href = images[index];
        document.head.appendChild(link);
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: rgb(23, 23, 23);
        overflow: hidden;
      }
      /* Compact centered splash until React SplashScreen mounts */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.85rem;
        padding: 1.25rem;
        box-sizing: border-box;
        background: var(--splash-html-bg, rgb(23, 23, 23));
        opacity: 1;
        transition: opacity 280ms ease;
        pointer-events: none;
      }
      #splash.is-done {
        opacity: 0;
      }
      #splash .splash-logo {
        width: 56px;
        height: 56px;
        object-fit: contain;
        filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.55));
      }
      #splash .splash-brand {
        margin: 0;
        font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        font-weight: 600;
        font-size: 1.05rem;
        letter-spacing: 0.18em;
        color: rgb(226, 220, 212);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }
      #splash .splash-eyebrow {
        margin: 0;
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgb(196, 186, 172);
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55);
      }
      #splash .splash-still {
        margin: 0;
        min-height: 0.8rem;
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.58rem;
        letter-spacing: 0.08em;
        color: rgba(226, 220, 212, 0.7);
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55);
      }
      #splash .splash-log {
        position: absolute;
        left: 1rem;
        right: 1rem;
        bottom: 1rem;
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: center;
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.62rem;
        letter-spacing: 0.04em;
        color: rgba(226, 220, 212, 0.85);
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.75);
      }
      #splash .splash-led {
        width: 6px;
        height: 6px;
        margin-top: 0.25rem;
        border-radius: 1px;
        background: rgb(242, 86, 35);
        animation: splash-blink 1.2s ease-in-out infinite;
      }
      /* The pulse is decoration, not status: it blinks at a fixed rate whatever
         the boot is doing. Held steady when motion is unwelcome. */
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-led { animation: none; opacity: 0.85; }
        #splash { transition: none; }
      }
      @keyframes splash-blink {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
    </style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <img class="splash-logo" src="/terra-logo.png" alt="" width="56" height="56"/>
  <p class="splash-brand">TERRA</p>
  <p class="splash-eyebrow">__BRAND_TAGLINE__</p>
  <!-- The release name, fixed for the version. React adds the version number
       to it once the Go side answers. -->
  <p class="splash-still">__RELEASE_NAME__</p>
  <p class="splash-log" id="splash-log">booting…</p>
  <div class="splash-led" aria-hidden="true"></div>
</div>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
