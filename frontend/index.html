<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>TERRA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <!-- Inter is asked for as a VARIABLE font with its optical size axis, not
         as three static weights.

         opsz is what makes a typeface hold its colour across sizes: at small
         sizes the strokes thicken and the spacing opens, at large sizes the
         contrast increases and the letters tighten. Inter carries the axis over
         14..32, and `font-optical-sizing: auto` is CSS's initial value -- so
         asking for the axis is the whole change, and no rule is needed to turn
         it on. Requested as static weights, as it was, the axis is simply not
         in the file and the property has nothing to act on.

         This interface runs from 9px telemetry to a 24px display face, which
         is the range the axis exists for. Verified before the change: the API
         serves different files for opsz@14 and opsz@32, and rejects an axis
         that does not exist. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&family=JetBrains+Mono:wght@400..500&family=Space+Grotesk:wght@500..700&display=swap"
      rel="stylesheet"
    />
    <!-- Must run before Leaflet loads: PointerEvent exists in WKWebView/desktop
         and would otherwise set L.Browser.touch=true, closing polygons at 3 pts. -->
    <script>window.L_NO_TOUCH = true</script>
    <script>
      // Rotates the splash still per launch. The list is substituted at build
      // time from src/lib/splashBackground.ts, which owns it -- this used to be
      // a second hard-coded copy that nothing kept in step.
      (function () {
        var images = __SPLASH_IMAGES__;
        var nextKey = "terra.splash.next";
        var currentKey = "terra.splash.current";
        var index = 0;
        try {
          var raw = localStorage.getItem(nextKey);
          var parsed = parseInt(raw || "0", 10);
          if (isFinite(parsed)) index = ((parsed % images.length) + images.length) % images.length;
          localStorage.setItem(nextKey, String((index + 1) % images.length));
          sessionStorage.setItem(currentKey, String(index));
        } catch (e) {}
        // Only the image: the scrim over it is src/splash.css's, shared with
        // the React splash, so the two cannot disagree about it.
        document.documentElement.style.setProperty(
          "--splash-still",
          'url("' + images[index] + '")'
        );

        // Only this launch's still is fetched. The React splash used to render
        // all three as background layers, so the browser pulled every one --
        // two of three downloads wasted on a window that shows one, competing
        // with the bundle for the boot it is meant to cover.
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.href = images[index];
        document.head.appendChild(link);
      })();
    </script>
    <!-- The splash's styles, shared with SplashScreen.tsx. Linked here rather
         than imported by the bundle, because the markup below paints before
         the bundle loads -- in development, CSS a module imports arrives only
         once that module runs. -->
    <link rel="stylesheet" href="/src/splash.css"/>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: rgb(23, 23, 23);
        overflow: hidden;
      }
    </style>
</head>
<body>
<!-- The splash until React mounts. The same markup SplashScreen.tsx renders,
     without the orbit: that one is SMIL, and a copy here would restart under
     the React one at the handoff. -->
<div id="splash" class="splash" aria-hidden="true">
  <div class="splash__still"></div>
  <div class="splash__scrim"></div>
  <div class="splash__grid"></div>
  <div class="splash__bar">
    <span class="splash__state"><span class="splash__dot"></span>Booting</span>
    <span class="splash__spacer"></span>
    <!-- The release name, fixed for the version. React adds the version number
         to it once the Go side answers. -->
    <span>__RELEASE_NAME__</span>
  </div>
  <div class="splash__body">
    <div class="splash__lockup">
      <img class="splash__mark" src="/terra-logo.png" alt=""/>
      <p class="splash__tagline">__BRAND_TAGLINE__</p>
    </div>
    <img class="splash__word" src="/terra-wordmark.svg" alt="" width="4669" height="728"/>
  </div>
  <div class="splash__foot">
    <p class="splash__label">Boot</p>
    <p class="splash__log">booting…</p>
  </div>
</div>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
