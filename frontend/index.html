<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>TERRA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <!-- Inter is asked for as a VARIABLE font with its optical size axis, not
         as three static weights.

         opsz is what makes a typeface hold its colour across sizes: at small
         sizes the strokes thicken and the spacing opens, at large sizes the
         contrast increases and the letters tighten. Inter carries the axis over
         14..32, and `font-optical-sizing: auto` is CSS's initial value -- so
         asking for the axis is the whole change, and no rule is needed to turn
         it on. Requested as static weights, as it was, the axis is simply not
         in the file and the property has nothing to act on.

         This interface runs from 9px telemetry to a 24px display face, which
         is the range the axis exists for. Verified before the change: the API
         serves different files for opsz@14 and opsz@32, and rejects an axis
         that does not exist.

         Exo 2 is the face of the TERRA mark, so the headings are set in the
         type the emblem is drawn in. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&family=JetBrains+Mono:wght@400..500&family=Exo+2:wght@500..700&display=swap"
      rel="stylesheet"
    />
    <!-- Must run before Leaflet loads: PointerEvent exists in WKWebView/desktop
         and would otherwise set L.Browser.touch=true, closing polygons at 3 pts. -->
    <script>window.L_NO_TOUCH = true</script>
    <!-- The photograph is the largest thing the splash draws and the first to
         move, so it is fetched with the stylesheet rather than when the parser
         reaches its img. The same candidates as the img, so the preload is the
         file the img then uses: the 840 px one in the 420x280 boot window. -->
    <link
      rel="preload"
      as="image"
      imagesrcset="/terra-splash-water-tap-840.webp 840w, /terra-splash-water-tap.webp 2400w"
      imagesizes="100vw"
    />
    <!-- The splash's styles, shared with SplashScreen.tsx. Linked here rather
         than imported by the bundle, because the markup below paints before
         the bundle loads -- in development, CSS a module imports arrives only
         once that module runs. -->
    <link rel="stylesheet" href="/src/splash.css"/>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: rgb(23, 23, 23);
        overflow: hidden;
      }
    </style>
</head>
<body>
<!-- The splash until React mounts. The same markup SplashScreen.tsx renders,
     without the version, which comes from the Go side when React asks, and
     without the photo credit, which only the full window shows, and this copy
     is only ever painted in the boot window. -->
<div id="splash" class="splash" aria-hidden="true">
  <div class="splash__scene">
    <img
      class="splash__photo"
      srcset="/terra-splash-water-tap-840.webp 840w, /terra-splash-water-tap.webp 2400w"
      sizes="100vw"
      src="/terra-splash-water-tap.webp"
      alt=""
    />
    <div class="splash__scrim"></div>
  </div>
  <div class="splash__bar">
    <span class="splash__spacer"></span>
    <span class="splash__state"><span class="splash__dot"></span>Booting</span>
  </div>
  <div class="splash__lockup">
    <img class="splash__mark" src="/terra-logo.png" alt=""/>
    <p class="splash__tagline">__BRAND_TAGLINE__</p>
  </div>
  <div class="splash__base">
    <div class="splash__tab"></div>
    <div class="splash__foot">
      <p class="splash__log">booting…</p>
    </div>
    <img class="splash__word" src="/terra-wordmark-filled.svg" alt="" width="4669" height="728"/>
  </div>
</div>
<!-- When this copy began to animate, for the React copy to start its own
     animations at the same frame; see "One clock" in src/splash.css. Written
     as the parser leaves the markup, a little before the first paint: through
     the cross-fade the two copies' orbits were measured 0.14 degrees apart,
     about 24 ms. -->
<script>document.getElementById("splash").dataset.t0 = String(performance.now())</script>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
